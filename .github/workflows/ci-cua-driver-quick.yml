name: Canonical Linux validation dispatch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact full driver commit SHA to certify
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  canonical:
    uses: ./.github/workflows/e2e-rust-linux.yml
    with:
      ref: ${{ inputs.ref }}
      lane: all
      cell_filter: ''

name: Canonical Linux validation dispatch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact full driver commit SHA to test
        required: true
        type: string
      lane:
        description: 'Complete certification or focused installer diagnosis'
        type: choice
        options: [all, installer]
        default: all

permissions:
  contents: read
  actions: read

jobs:
  canonical:
    uses: ./.github/workflows/e2e-rust-linux.yml
    with:
      ref: ${{ inputs.ref }}
      lane: ${{ inputs.lane || 'all' }}
      cell_filter: ''
